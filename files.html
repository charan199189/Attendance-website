<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Files</title>

<style>

/* ================= RESET ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Arial;
}

::-webkit-scrollbar{
display:none;
}

body{
scrollbar-width:none;
-ms-overflow-style:none;
background:linear-gradient(135deg,#e9d8fd,#ddd6fe,#c7d2fe);
min-height:100vh;
padding-top:120px;
padding-left:0;
padding-right:0;
padding-bottom:50px;
overflow-y:auto;
}

/* ================= BANNER ================= */

.banner{
position:fixed;
top:0;
width:100%;
background:white;
box-shadow:0 4px 12px rgba(0,0,0,.15);
z-index:1000;
overflow:hidden;
animation:bannerDrop .8s ease;
}

.banner img{
width:100%;
max-height:110px;
object-fit:contain;
animation:bannerZoom 4s ease-in-out infinite alternate;
}

/* ================= CONTAINER ================= */

.container{
width:92%;
max-width:700px;
margin:auto;
padding-bottom:40px;
animation:fadeUp .7s ease;
}

/* ================= TOP BOX ================= */

.topBox{
background:rgba(255,255,255,.85);
backdrop-filter:blur(14px);
padding:18px;
border-radius:22px;
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:22px;
box-shadow:0 10px 25px rgba(0,0,0,.12);
animation:fadeUp .6s ease;
}

.title{
font-size:22px;
font-weight:700;
color:#4c1d95;
line-height:1.4;
}

/* ================= BACK BUTTON ================= */

.backBtn{
background:linear-gradient(45deg,#ff7a18,#ff3d3d);
border:none;
padding:10px 16px;
border-radius:12px;
color:white;
font-weight:600;
cursor:pointer;
transition:.3s;
box-shadow:0 4px 12px rgba(255,60,60,.25);
}

.backBtn:hover{
transform:translateY(-2px);
box-shadow:0 8px 20px rgba(255,60,60,.35);
}

/* ================= FILE CARD ================= */

.fileCard{
background:white;
padding:18px;
border-radius:18px;
margin-bottom:12px;
box-shadow:0 6px 18px rgba(0,0,0,.1);
transition:.3s;
animation:fadeUp .5s ease;
}

.fileCard:hover{
transform:translateY(-2px);
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.fileLink{
text-decoration:none;
color:#4c1d95;
font-size:17px;
font-weight:600;
display:block;
}

/* ================= EMPTY ================= */

.empty{
background:white;
padding:25px;
border-radius:20px;
text-align:center;
color:#6b7280;
font-weight:600;
font-size:16px;
box-shadow:0 6px 18px rgba(0,0,0,.1);
animation:fadeUp .6s ease;
}

/* ================= ANIMATIONS ================= */

@keyframes bannerDrop{
from{
transform:translateY(-100%);
opacity:0;
}
to{
transform:translateY(0);
opacity:1;
}
}

@keyframes bannerZoom{
0%{
transform:scale(1);
}
100%{
transform:scale(1.03);
}
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(25px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* ================= MOBILE ================= */

@media(max-width:500px){

.title{
font-size:18px;
}

.topBox{
padding:15px;
}

.fileLink{
font-size:16px;
}

.backBtn{
padding:8px 14px;
}

}

</style>

</head>

<body>

</script>

</body>
</html>
