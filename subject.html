<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Subject Material</title>

<style>

/* ================= RESET ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",Arial;
}

::-webkit-scrollbar{
display:none;
}

body{
scrollbar-width:none;
-ms-overflow-style:none;
background:linear-gradient(135deg,#e9d8fd,#ddd6fe,#c7d2fe);
min-height:100vh;
padding-top:120px;
padding-bottom:40px;
}

/* ================= BANNER ================= */

.banner{
position:fixed;
top:0;
width:100%;
background:white;
box-shadow:0 4px 12px rgba(0,0,0,.15);
z-index:1000;
overflow:hidden;
animation:bannerDrop .8s ease;
}

.banner img{
width:100%;
max-height:110px;
object-fit:contain;
animation:bannerZoom 4s ease-in-out infinite alternate;
}

/* ================= ANIMATIONS ================= */

@keyframes bannerDrop{
from{
transform:translateY(-100%);
opacity:0;
}
to{
transform:translateY(0);
opacity:1;
}
}

@keyframes bannerZoom{
0%{
transform:scale(1);
}
100%{
transform:scale(1.03);
}
}

@keyframes fadeUp{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* ================= CONTAINER ================= */

.container{
width:92%;
max-width:500px;
margin:auto;
animation:fadeUp .7s ease;
}

/* ================= TOP BOX ================= */

.topBox{
background:rgba(255,255,255,.78);
backdrop-filter:blur(14px);
padding:16px;
border-radius:22px;
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.subjectTitle{
font-size:22px;
font-weight:700;
color:#4c1d95;
}

/* ================= BACK BUTTON ================= */

.backBtn{
background:linear-gradient(45deg,#ff7a18,#ff3d3d);
border:none;
color:white;
padding:10px 16px;
border-radius:12px;
cursor:pointer;
font-weight:600;
transition:.3s;
}

.backBtn:hover{
transform:translateY(-2px);
}

/* ================= SECTION CARDS ================= */

.card{
background:white;
padding:22px;
border-radius:22px;
margin-bottom:18px;
cursor:pointer;
box-shadow:0 8px 20px rgba(0,0,0,.1);
transition:.3s;
}

.card:hover{
transform:translateY(-4px);
}

.cardTitle{
display: flex;
justify-content: space-between;
align-items: center;
font-size:20px;
font-weight:700;
color:#4c1d95;
margin-bottom:8px;
}

.cardTitle span{
background:#eef2ff;
color:#6366f1;
padding:4px 10px;
border-radius:20px;
font-size:14px;
font-weight:700;
}

.cardDesc{
font-size:14px;
color:#6b7280;
line-height:1.5;
}

/* ================= MOBILE ================= */

@media(max-width:500px){

.subjectTitle{
font-size:20px;
}

.card{
padding:18px;
}

.cardTitle{
font-size:18px;
}

}

</style>

</head>

<body>

<!-- ================= BANNER ================= -->

<div class="banner">
<img src="banner.png">
</div>

<!-- ================= CONTAINER ================= -->

<div class="container">

<!-- TOP -->

<div class="topBox">

<div class="subjectTitle"
id="subjectName">
Subject
</div>

<button class="backBtn"
onclick="goBack()">
← Back
</button>

</div>

<!-- PDFS -->

<div class="card"
onclick="openSection('pdfs')">

<div class="cardTitle">
📄 PDFs <span id="pdfCount">0</span>
</div>

<div class="cardDesc">
Lecture notes, unit materials, important PDFs and study content.
</div>

</div>

<!-- PAPERS -->

<div class="card"
onclick="openSection('papers')">

<div class="cardTitle">
📝 Question Papers <span id="paperCount">0</span>
</div>

<div class="cardDesc">
Previous semester papers, model papers and important questions.
</div>

</div>

<!-- EXTRA -->

<div class="card"
onclick="openSection('extra')">

<div class="cardTitle">
📌 Extra Information <span id="extraCount">0</span>
</div>

<div class="cardDesc">
Images, video links, reference materials and additional resources.
</div>

</div>

</div>

<script>

let subject =
localStorage.getItem("subject") || "Subject"

const counts = {

DEVC:{pdfs:0,papers:4,extra:0},
Chemistry:{pdfs:0,papers:0,extra:0},
DS:{pdfs:0,papers:0,extra:0},
BEEE:{pdfs:7,papers:2,extra:0},
Civil:{pdfs:3,papers:3,extra:5},
Mechanical:{pdfs:3,papers:1,extra:1}

};

if(counts[subject]){

document.getElementById("pdfCount").innerText =
counts[subject].pdfs;

document.getElementById("paperCount").innerText =
counts[subject].papers;

document.getElementById("extraCount").innerText =
counts[subject].extra;

}

document.getElementById("subjectName").innerText =
subject

function openSection(type){

localStorage.setItem("category",type)

window.location.href="files.html"

}

function goBack(){

if(
subject==="Civil" ||
subject==="Mechanical"
){
window.location.href="cm.html"
}
else{
window.location.href="material.html"
}

}

</script>

</body>
</html>
